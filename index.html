<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>منيو أمية تشكن</title><style>
:root{--bg:#0b0b0b;--gold:#d4af37;--g2:#f3d77a;--tx:#f2eadb;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{text-align:center;padding:22px 16px 10px}header img{width:210px;max-width:70%}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid #2a2a2a;z-index:5}
.tab,.b{flex:none;padding:8px 16px;border-radius:20px;border:1px solid var(--gold);background:none;color:var(--gold);font:inherit;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--g2),var(--gold));color:#111;font-weight:700}
main{max-width:640px;margin:auto;padding:16px 16px 90px}
h2{color:var(--gold);text-align:center;margin:8px 0 14px;font-size:26px}
.it{display:flex;justify-content:space-between;gap:12px;padding:13px 4px;border-bottom:1px dashed #333;line-height:1.5}
.pr{color:var(--g2);font-weight:700;white-space:nowrap}
.ar{display:flex;gap:6px;margin:7px 0}
input{background:#1c1c1c;color:var(--tx);border:1px solid #3a3a3a;border-radius:8px;padding:9px;font:inherit}
.ar input:first-child,.nm{flex:1;min-width:0}.ar input[type=number]{width:86px}
.b{border-radius:8px;padding:8px 12px}
.sv{position:fixed;bottom:0;left:0;right:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:#111;border-top:1px solid var(--gold);display:flex;gap:8px;z-index:9;flex-wrap:wrap}
.ft{text-align:center;margin-top:30px}.ft button{background:none;border:0;color:#555;font:inherit;font-size:12px}
